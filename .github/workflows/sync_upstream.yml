name: sync_upstream

# Weekly attempt to bring upstream zed-industries/zed into this fork's `build`
# branch. On a clean merge it pushes `build` and kicks off build_fork_mac so a
# fresh macOS app is published. On a merge conflict it does NOT guess: it aborts,
# opens (or comments on) a GitHub issue that tags the maintainer, and fails the
# run so the conflict can be resolved by hand.
#
# IMPORTANT: GitHub only runs `schedule:` triggers from the repo's DEFAULT
# branch. This file must live on the default branch for the weekly cron to fire.
# Recommended: make `build` the fork's default branch (it is what we build from).

on:
  schedule:
    # Mondays 07:00 UTC ~= Sunday night US Pacific (GitHub cron is UTC, no DST).
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: sync_upstream
  cancel-in-progress: false

permissions:
  contents: write   # push the updated `build` branch
  issues: write     # open/comment the conflict issue
  actions: write    # trigger build_fork_mac on success

env:
  UPSTREAM_REPO: https://github.com/zed-industries/zed.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: build
  MAINTAINER: ebertn
  # gh defaults a fork's base repo to its upstream parent; pin every gh
  # command to this fork so dispatch/issue calls don't hit zed-industries/zed.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (build)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "zed-fork-sync[bot]"
          git config user.email "zed-fork-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream into build
        id: merge
        run: |
          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream/$UPSTREAM_BRANCH."
            echo "result=nochange" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            after="$(git rev-parse HEAD)"
            echo "Merged upstream cleanly ($before -> $after)."
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflict; aborting."
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push build
        if: steps.merge.outputs.result == 'clean'
        run: git push origin "HEAD:$TARGET_BRANCH"

      - name: Trigger macOS build
        if: steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_fork_mac.yml --ref "$TARGET_BRANCH"

      - name: Nothing to do
        if: steps.merge.outputs.result == 'nochange'
        run: echo "No upstream changes this week; skipping build."

      - name: Open conflict issue and fail
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="Weekly upstream sync failed: merge conflict"
          body="$(cat <<EOF
          @$MAINTAINER the weekly upstream sync hit a **merge conflict** merging \`upstream/$UPSTREAM_BRANCH\` into \`$TARGET_BRANCH\`, so no new macOS build was produced.

          Failed run: $run_url

          ## Resolve locally
          \`\`\`sh
          git fetch origin && git switch $TARGET_BRANCH && git pull
          git remote add upstream $UPSTREAM_REPO 2>/dev/null || true
          git fetch upstream $UPSTREAM_BRANCH
          git merge upstream/$UPSTREAM_BRANCH      # resolve conflicts, then:
          git add -A && git commit --no-edit
          git push origin $TARGET_BRANCH
          \`\`\`
          Pushing \`$TARGET_BRANCH\` (or re-running this workflow) will produce the next build.
          EOF
          )"
          # Reuse a single rolling issue instead of opening a new one each week.
          gh label create upstream-sync-failed --color B60205 \
            --description "Weekly upstream sync needs manual conflict resolution" 2>/dev/null || true
          existing="$(gh issue list --state open --label upstream-sync-failed --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label upstream-sync-failed --body "$body"
          fi
          exit 1
